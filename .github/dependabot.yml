version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
    groups:
      go-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
