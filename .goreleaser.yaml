version: 2

project_name: casemate

builds:
  - main: ./cmd/casemate
    binary: casemate
    env:
      - CGO_ENABLED=0
    # Windows is not built for now: the test suite does not run there.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Build={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - src: completions/*
        dst: completions
      - src: man/casemate.1
        dst: man/casemate.1

# .deb and .rpm packages for Linux. macOS keeps using Homebrew.
nfpms:
  - id: packages
    package_name: casemate
    homepage: https://github.com/dterana/casemate
    maintainer: David Terana <david@terana.io>
    description: Password-based file encryption (AES-256-GCM, Argon2id)
    license: MIT
    formats: [deb, rpm]
    bindir: /usr/bin
    contents:
      - src: completions/casemate.bash
        dst: /usr/share/bash-completion/completions/casemate
      - src: completions/casemate.zsh
        dst: /usr/share/zsh/vendor-completions/_casemate
      - src: completions/casemate.fish
        dst: /usr/share/fish/vendor_completions.d/casemate.fish
      - src: man/casemate.1
        dst: /usr/share/man/man1/casemate.1

checksum:
  name_template: checksums.txt

# One SBOM per archive, generated with syft (installed by the release workflow).
sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge pull request'
      - '^ci:'
      - '^deps:'
