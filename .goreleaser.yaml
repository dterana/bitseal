version: 2

project_name: casemate

builds:
  - main: ./cmd/casemate
    binary: casemate
    env:
      - CGO_ENABLED=0
    # Windows is not built for now: the test suite does not run there.
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.Build={{.ShortCommit}}

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# One SBOM per archive, generated with syft (installed by the release workflow).
sboms:
  - artifacts: archive

release:
  # Releases stay pre-releases until 1.0; remove this line then.
  prerelease: true

changelog:
  sort: asc
  filters:
    exclude:
      - '^Merge pull request'
      - '^ci:'
      - '^deps:'
